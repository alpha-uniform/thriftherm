set_override:
  fields:
    room:
      required: true
      example: badezimmer
      selector:
        text:
    temperature:
      required: true
      example: 22
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    duration_min:
      required: false
      example: 90
      selector:
        number:
          min: 5
          max: 1440
          step: 5
          unit_of_measurement: min

clear_override:
  fields:
    room:
      required: false
      example: badezimmer
      selector:
        text:

set_away:
  fields:
    return_time:
      required: false
      example: "2026-12-24 16:00"
      selector:
        datetime:
    clear_return_time:
      required: false
      selector:
        boolean:

clear_away:

reset_learning:
  fields:
    scope:
      required: false
      example: '["heat_pump"]'
      selector:
        select:
          multiple: true
          options:
            - boiler
            - heat_pump
            - rooms
    rooms:
      required: false
      example: '["badezimmer"]'
      selector:
        text:
          multiple: true

boost:
  fields:
    room:
      required: true
      example: badezimmer
      selector:
        text:
    duration_min:
      required: false
      example: 45
      selector:
        number:
          min: 5
          max: 240
          step: 5
          unit_of_measurement: min
