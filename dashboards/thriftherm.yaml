# Thriftherm: Beispiel-Dashboard (deutsche Beschriftung)
#
# Einfügen: Einstellungen > Dashboards > Dashboard hinzufügen
#   > Neues Dashboard von Grund auf > Dashboard öffnen > Stift oben rechts
#   > ⋮ > Raw-Konfigurationseditor > alles ersetzen durch diese Datei > Speichern.
#
# Nur Standard-Karten von Home Assistant, keine Zusatzkarten aus HACS.
# Die Textkarten brauchen Home Assistant 2025.1 oder neuer.
#
# RÄUME ANPASSEN (wichtig):
#   Die Ansicht "Räume" und die Ansicht "Verlauf" enthalten zwei Beispielräume:
#   "badezimmer" und "wohnzimmer". Das ist der Raumschlüssel: der Raumname
#   klein geschrieben, so wie er in den Entitäts-IDs steht, ohne Umlaute.
#   Beispiel: Raum "Küche" ergibt sensor.thriftherm_kuche_target_temperature.
#   Für jeden eigenen Raum einen Raumblock kopieren und den Raumschlüssel
#   ersetzen (Suchen und Ersetzen im Editor). Nicht vorhandene Räume löschen.
#   Deine Raumschlüssel findest du unter Einstellungen > Geräte & Dienste
#   > Entitäten, Suche "thriftherm_" und "target_temperature".
#
# THERMOSTAT JE RAUM:
#   "climate.badezimmer" und "climate.wohnzimmer" stehen für das Thermostat,
#   das du in Thriftherm dem Raum gegeben hast (z. B. Better Thermostat).
#   Es liefert die gemessene Raumtemperatur. Durch deine Entität ersetzen.
#
# Nicht jeder Raum hat alle Entitäten:
#   - "Fenster offen" gibt es nur mit Fensterkontakt.
#   - "Thermostat-Plan" gibt es nur mit Thermostat.
#   - "Schnell aufheizen" gibt es nur mit Thermostat oder Wärmepumpe im Raum.
#   Fehlt eine, zeigt die Karte "Entität nicht verfügbar". Dann die Karte löschen.
#
# Ohne Wärmepumpe: die Ansicht "Wärmepumpe" ganz löschen.
# Ohne Gastherme (z. B. Fernwärme): die Ansicht "Therme" ganz löschen.

title: Heizung
views:
  # ---------------------------------------------------------------------------
  # Ansicht 1: Übersicht. Was heizt gerade und warum. Ganz oben steht der Grund.
  # ---------------------------------------------------------------------------
  - title: Übersicht
    path: uebersicht
    icon: mdi:home-thermometer
    type: sections
    max_columns: 3
    sections:
      # Block: Warum heizt es gerade so? Klartext von Thriftherm.
      - type: grid
        cards:
          - type: heading
            heading: Was gerade passiert
            icon: mdi:comment-question
          # Der Entscheidungsgrund als Liste. Jede Zeile ist ein Grund.
          - type: markdown
            content: |
              {% set gruende = state_attr('sensor.thriftherm_decision_reason', 'reasons') %}
              {% if gruende %}{% for g in gruende %}
              - {{ g }}
              {%- endfor %}
              {% else %}{{ states('sensor.thriftherm_decision_reason') }}{% endif %}
          # Welche Wärmequelle Thriftherm jetzt nimmt.
          - type: tile
            entity: sensor.thriftherm_recommended_heat_source
            name: Empfohlen
          # Günstigere Quelle nach Kosten je kWh Wärme (nur mit Wärmepumpe).
          - type: tile
            entity: sensor.thriftherm_cheaper_heat_source
            name: Günstiger
          # Sicherheitsstatus. Ist er nicht OK, stehen die Gründe darunter.
          - type: tile
            entity: sensor.thriftherm_safety_state
            name: Sicherheit
          # Ist irgendwo von Hand übersteuert?
          - type: tile
            entity: binary_sensor.thriftherm_override_active
            name: Übersteuert
          # Nur sichtbar, wenn die Sicherheit nicht OK ist: die Gründe.
          - type: entities
            title: Warum eingeschränkt
            visibility:
              - condition: state
                entity: sensor.thriftherm_safety_state
                state_not: ok
            entities:
              - type: attribute
                entity: sensor.thriftherm_safety_state
                attribute: issues
                name: Probleme
              - type: attribute
                entity: sensor.thriftherm_safety_state
                attribute: frost_rooms
                name: Frostgefahr in

      # Block: Betriebsmodus und die drei Steuerungen (Aus, Nur planen, Aktiv).
      - type: grid
        cards:
          - type: heading
            heading: Steuerung
            icon: mdi:tune-variant
          # Betriebsmodus: Automatik, Nur Heizung, Nur Wärmepumpe, Sommerbetrieb, Abwesend.
          - type: tile
            entity: select.thriftherm_operating_mode
            name: Betriebsmodus
            grid_options:
              columns: full
            features:
              - type: select-options
          # Rückkehr: nur sichtbar im Modus "Abwesend".
          - type: entities
            visibility:
              - condition: state
                entity: select.thriftherm_operating_mode
                state: away
            entities:
              - entity: datetime.thriftherm_planned_return
                name: Rückkehr
          # Hebt alle Änderungen von Hand auf (Thermostat, Wärmepumpe, Übersteuerung).
          - type: tile
            entity: button.thriftherm_back_to_automatic
            name: Zurück zur Automatik
            icon: mdi:restore
            hide_state: true
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.thriftherm_back_to_automatic
            icon_tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.thriftherm_back_to_automatic
          # Die drei Steuerungen. "Nur planen" rechnet nur, sendet aber nichts.
          # Ohne Wärmepumpe oder ohne Therme fehlt die jeweilige Zeile: löschen.
          - type: entities
            entities:
              - entity: select.thriftherm_heat_pump_control
                name: Wärmepumpe
              - entity: select.thriftherm_boiler_control
                name: Therme
              - entity: select.thriftherm_room_control
                name: Räume
              - entity: sensor.thriftherm_automation_state
                name: Automatik

      # Block: Außentemperatur, Grundlage vieler Entscheidungen.
      - type: grid
        cards:
          - type: heading
            heading: Draußen
            icon: mdi:thermometer
          - type: tile
            entity: sensor.thriftherm_outdoor_temperature_selected_source
            name: Außentemperatur

  # ---------------------------------------------------------------------------
  # Ansicht 2: Räume. Ein Abschnitt je Raum. Zum Anpassen siehe Kopf der Datei.
  # ---------------------------------------------------------------------------
  - title: Räume
    path: raeume
    icon: mdi:sofa
    type: sections
    max_columns: 3
    sections:
      # === Raumblock: badezimmer (Beispiel; kopieren und Raumschlüssel ersetzen) ===
      - type: grid
        cards:
          # Überschrift; das Fenster-Symbol erscheint nur bei offenem Fenster.
          - type: heading
            heading: Badezimmer
            icon: mdi:shower
            badges:
              - type: entity
                entity: binary_sensor.thriftherm_badezimmer_window_open
                visibility:
                  - condition: state
                    entity: binary_sensor.thriftherm_badezimmer_window_open
                    state: "on"
          # Gemessene Temperatur (vom Thermostat) und Heizbedarf.
          - type: tile
            entity: climate.badezimmer
            name: Ist
            state_content: current_temperature
          - type: tile
            entity: sensor.thriftherm_badezimmer_heat_demand
            name: Heizbedarf
          # Soll jetzt mit Grund. Eine Änderung von Hand steht nur da, wenn es eine gibt.
          - type: markdown
            content: |
              {%- set e = 'sensor.thriftherm_badezimmer_target_temperature' %}
              {%- set f = 'binary_sensor.thriftherm_badezimmer_window_open' %}
              {%- set h = 'binary_sensor.thriftherm_badezimmer_heating_allowed' %}
              {%- set t = 'sensor.thriftherm_badezimmer_thermostat_plan' %}
              {%- if states(e) | is_number %}
              **Soll {{ '%.1f' | format(states(e) | float) | replace('.', ',') }} °C**, {{ state_attr_translated(e, 'reason') }}
              {%- else %}
              Soll gerade nicht verfügbar
              {%- endif %}
              {%- if is_state(f, 'on') %}

              Fenster offen, Heizen pausiert
              {%- elif is_state(h, 'off') %}

              Heizen pausiert{% if state_attr(t, 'reason') in ['thermostat_off', 'thermostat_unavailable'] %}: {{ state_attr_translated(t, 'reason') }}{% endif %}
              {%- endif %}
              {%- if state_attr(e, 'override_by') %}

              Von Hand geändert: {{ state_attr_translated(e, 'override_by') }}
              {%- set u = state_attr(e, 'override_until_ts') %}
              {%- if u %}, bis {{ u | timestamp_custom('%H:%M' if (u | timestamp_custom('%Y-%m-%d')) == now().strftime('%Y-%m-%d') else '%d.%m. %H:%M') }} Uhr{% endif %}
              {%- endif %}
          # Was Thriftherm dem Thermostat gibt (nur mit Thermostat).
          - type: tile
            entity: sensor.thriftherm_badezimmer_thermostat_plan
            name: Thermostat
          # Schnell aufheizen: Raum heizt sofort auf Komfort.
          - type: tile
            entity: button.thriftherm_badezimmer_quick_heat_up
            name: Schnell aufheizen
            icon: mdi:fire
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.thriftherm_badezimmer_quick_heat_up
            icon_tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.thriftherm_badezimmer_quick_heat_up
          # Komfort- und Absenktemperatur zum Einstellen.
          - type: entities
            entities:
              - entity: number.thriftherm_badezimmer_comfort_temperature
                name: Komfort
                icon: mdi:sun-thermometer
              - entity: number.thriftherm_badezimmer_setback_temperature
                name: Absenkung
                icon: mdi:thermometer-low

      # === Raumblock: wohnzimmer (zweites Beispiel) ===
      - type: grid
        cards:
          - type: heading
            heading: Wohnzimmer
            icon: mdi:sofa
            badges:
              - type: entity
                entity: binary_sensor.thriftherm_wohnzimmer_window_open
                visibility:
                  - condition: state
                    entity: binary_sensor.thriftherm_wohnzimmer_window_open
                    state: "on"
          - type: tile
            entity: climate.wohnzimmer
            name: Ist
            state_content: current_temperature
          - type: tile
            entity: sensor.thriftherm_wohnzimmer_heat_demand
            name: Heizbedarf
          - type: markdown
            content: |
              {%- set e = 'sensor.thriftherm_wohnzimmer_target_temperature' %}
              {%- set f = 'binary_sensor.thriftherm_wohnzimmer_window_open' %}
              {%- set h = 'binary_sensor.thriftherm_wohnzimmer_heating_allowed' %}
              {%- set t = 'sensor.thriftherm_wohnzimmer_thermostat_plan' %}
              {%- if states(e) | is_number %}
              **Soll {{ '%.1f' | format(states(e) | float) | replace('.', ',') }} °C**, {{ state_attr_translated(e, 'reason') }}
              {%- else %}
              Soll gerade nicht verfügbar
              {%- endif %}
              {%- if is_state(f, 'on') %}

              Fenster offen, Heizen pausiert
              {%- elif is_state(h, 'off') %}

              Heizen pausiert{% if state_attr(t, 'reason') in ['thermostat_off', 'thermostat_unavailable'] %}: {{ state_attr_translated(t, 'reason') }}{% endif %}
              {%- endif %}
              {%- if state_attr(e, 'override_by') %}

              Von Hand geändert: {{ state_attr_translated(e, 'override_by') }}
              {%- set u = state_attr(e, 'override_until_ts') %}
              {%- if u %}, bis {{ u | timestamp_custom('%H:%M' if (u | timestamp_custom('%Y-%m-%d')) == now().strftime('%Y-%m-%d') else '%d.%m. %H:%M') }} Uhr{% endif %}
              {%- endif %}
          - type: tile
            entity: sensor.thriftherm_wohnzimmer_thermostat_plan
            name: Thermostat
          - type: tile
            entity: button.thriftherm_wohnzimmer_quick_heat_up
            name: Schnell aufheizen
            icon: mdi:fire
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.thriftherm_wohnzimmer_quick_heat_up
            icon_tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.thriftherm_wohnzimmer_quick_heat_up
          - type: entities
            entities:
              - entity: number.thriftherm_wohnzimmer_comfort_temperature
                name: Komfort
                icon: mdi:sun-thermometer
              - entity: number.thriftherm_wohnzimmer_setback_temperature
                name: Absenkung
                icon: mdi:thermometer-low

  # ---------------------------------------------------------------------------
  # Ansicht 3: Therme. Nur mit Gastherme. Sonst Ansicht löschen.
  # ---------------------------------------------------------------------------
  - title: Therme
    path: therme
    icon: mdi:water-boiler
    type: sections
    max_columns: 3
    sections:
      # Block: Was die Therme tun soll und warum.
      - type: grid
        cards:
          - type: heading
            heading: Befehl an die Therme
            icon: mdi:water-boiler
          - type: tile
            entity: sensor.thriftherm_boiler_command
            name: Befehl
          # Vorlauf-Soll gibt es nur, solange die Therme heizen darf.
          - type: tile
            entity: sensor.thriftherm_boiler_flow_setpoint_planned
            name: Vorlauf-Soll
            visibility:
              - condition: state
                entity: sensor.thriftherm_boiler_flow_setpoint_planned
                state_not:
                  - unknown
                  - unavailable
          - type: entities
            entities:
              - type: attribute
                entity: sensor.thriftherm_boiler_command
                attribute: reason
                name: Grund
                icon: mdi:information-outline
              - type: attribute
                entity: sensor.thriftherm_boiler_command
                attribute: heating_curve_flow
                name: Vorlauf laut Heizkurve
                icon: mdi:chart-bell-curve-cumulative
                suffix: °C
          - type: tile
            entity: binary_sensor.thriftherm_boiler_space_heating_active
            name: Heizbetrieb
            icon: mdi:radiator
          - type: tile
            entity: binary_sensor.thriftherm_boiler_hot_water_active
            name: Warmwasser
            icon: mdi:water-thermometer
          - type: tile
            entity: binary_sensor.thriftherm_boiler_data_available
            name: Daten da

      # Block: Messwerte der Therme.
      - type: grid
        cards:
          - type: heading
            heading: Messwerte
            icon: mdi:gauge
          # Spreizung ist ab Werk deaktiviert (Diagnose). Bei Bedarf unter
          # Entitäten aktivieren, sonst zeigt die Kachel "nicht verfügbar".
          - type: tile
            entity: sensor.thriftherm_boiler_flow_return_spread
            name: Spreizung
          - type: tile
            entity: sensor.thriftherm_boiler_burner_share
            name: Brenneranteil
          # Gasleistung braucht einen Gaszähler oder eine Vaillant-Therme.
          - type: tile
            entity: sensor.thriftherm_gas_power
            name: Gasleistung
            icon: mdi:fire
          # Gas für Heizung und Warmwasser (Zählerstände in kWh).
          - type: tile
            entity: sensor.thriftherm_gas_for_heating
            name: Gas Heizung
            icon: mdi:radiator
          - type: tile
            entity: sensor.thriftherm_gas_for_hot_water
            name: Gas Warmwasser
            icon: mdi:water-thermometer

      # Block: Lernen. Thriftherm lernt die Heizkurve selbst nach.
      - type: grid
        cards:
          - type: heading
            heading: Lernen
            icon: mdi:school
          - type: markdown
            content: |
              {% set e = 'sensor.thriftherm_learning_state' %}
              {% set warum = {
                'no_heating_run': 'die Therme gerade nicht heizt',
                'rooms_heating_up': 'ein Raum mit Zuschlag aufheizt',
                'setpoint_recently_changed': 'ein Sollwert gerade geändert wurde',
                'quick_heat_up': 'ein Raum schnell aufheizt',
                'drying_mode': 'das Bad getrocknet wird',
                'boiler_control_not_active': 'die Thermensteuerung nicht aktiv ist',
                'hot_water_recent': 'gerade Warmwasser lief'} %}
              {% set p = state_attr(e, 'paused_because') or [] %}
              **{{ state_translated(e) }}**
              {%- if p %}, weil {% for c in p %}{{ warum.get(c, 'die Sicherheit eingeschränkt ist' if c.startswith('safety_') else c) }}{% if not loop.last %} und {% endif %}{% endfor %}{% endif %}

              Heizkurve verschoben um {{ '%.1f' | format(state_attr(e, 'heating_curve_offset_k') | float(0)) | replace('.', ',') }} Grad
              {%- if state_attr(e, 'flow_set_by') %}

              Den Vorlauf bestimmt: {{ state_attr(e, 'flow_set_by') }}
              {%- endif %}
              {%- set z = state_attr(e, 'heat_up_extra_k') or {} %}
              {%- if z %}

              Aufheiz-Zuschlag: {% for raum, k in z.items() %}{{ raum }} {{ '%.1f' | format(k) | replace('.', ',') }} Grad{% if not loop.last %}, {% endif %}{% endfor %}
              {%- endif %}

  # ---------------------------------------------------------------------------
  # Ansicht 4: Wärmepumpe. Nur mit eingerichteter Wärmepumpe. Sonst löschen.
  # ---------------------------------------------------------------------------
  - title: Wärmepumpe
    path: waermepumpe
    icon: mdi:heat-pump
    type: sections
    max_columns: 3
    sections:
      # Block: Befehl und ob die Wärmepumpe heizen darf.
      - type: grid
        cards:
          - type: heading
            heading: Befehl an die Wärmepumpe
            icon: mdi:heat-pump
          - type: tile
            entity: sensor.thriftherm_heat_pump_command
            name: Befehl
          - type: tile
            entity: sensor.thriftherm_heat_pump_run_state
            name: Betrieb
          - type: entities
            entities:
              - type: attribute
                entity: sensor.thriftherm_heat_pump_command
                attribute: reason
                name: Grund
                icon: mdi:information-outline
          # Nur sichtbar, wenn die Wärmepumpe nicht erreichbar oder nicht zum Heizen bereit ist.
          - type: tile
            entity: binary_sensor.thriftherm_heat_pump_available_for_heating
            name: Zum Heizen bereit
            visibility:
              - condition: state
                entity: binary_sensor.thriftherm_heat_pump_available_for_heating
                state_not: "on"
          - type: tile
            entity: binary_sensor.thriftherm_heat_pump_blocked_for_heating
            name: Sperre
          - type: tile
            entity: binary_sensor.thriftherm_defrost_or_icing_suspected
            name: Abtauen
          # Nur sichtbar, wenn die Wärmepumpe gesperrt ist: der Grund.
          - type: entities
            visibility:
              - condition: state
                entity: binary_sensor.thriftherm_heat_pump_blocked_for_heating
                state: "on"
            entities:
              - type: attribute
                entity: binary_sensor.thriftherm_heat_pump_blocked_for_heating
                attribute: reason
                name: Gesperrt wegen
                icon: mdi:lock-alert

      # Block: Leistung und Wirkungsgrad.
      - type: grid
        cards:
          - type: heading
            heading: Leistung
            icon: mdi:flash
          # Gemessen nur, solange sie heizt.
          - type: tile
            entity: sensor.thriftherm_heat_pump_cop
            name: COP gemessen
          - type: tile
            entity: sensor.thriftherm_break_even_cop
            name: Lohnt sich ab COP
          # Der COP, mit dem Thriftherm gerade rechnet (auch im Stillstand).
          - type: entities
            entities:
              - type: attribute
                entity: sensor.thriftherm_heat_pump_command
                attribute: decision_cop
                name: COP, mit dem Thriftherm rechnet
                icon: mdi:calculator-variant
          - type: tile
            entity: sensor.thriftherm_heat_pump_thermal_power
            name: Wärmeleistung
          - type: tile
            entity: sensor.thriftherm_heat_pump_electrical_power
            name: Stromaufnahme

      # Block: Was kostet eine kWh Wärme? Daraus folgt die günstigere Quelle.
      - type: grid
        cards:
          - type: heading
            heading: Kosten je kWh Wärme
            icon: mdi:cash
          - type: tile
            entity: sensor.thriftherm_heat_cost_per_kwh_heat_pump
            name: Wärmepumpe
          - type: tile
            entity: sensor.thriftherm_heat_cost_per_kwh_boiler
            name: Therme
          - type: tile
            entity: sensor.thriftherm_cheaper_heat_source
            name: Günstiger
            grid_options:
              columns: full

  # ---------------------------------------------------------------------------
  # Ansicht 5: Verlauf.
  # ---------------------------------------------------------------------------
  - title: Verlauf
    path: verlauf
    icon: mdi:chart-line
    type: sections
    max_columns: 2
    sections:
      # Je Raum: gemessene Temperatur, Soll und wann geheizt wurde (vom Thermostat),
      # dazu das Soll von Thriftherm (weicht im Modus "Nur planen" ab).
      - type: grid
        cards:
          - type: history-graph
            title: Badezimmer (24 h)
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: climate.badezimmer
                name: Badezimmer
              - entity: sensor.thriftherm_badezimmer_target_temperature
                name: Soll laut Thriftherm
          - type: history-graph
            title: Wohnzimmer (24 h)
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: climate.wohnzimmer
                name: Wohnzimmer
              - entity: sensor.thriftherm_wohnzimmer_target_temperature
                name: Soll laut Thriftherm
          # Heizbedarf der Räume in Prozent.
          - type: history-graph
            title: Heizbedarf (24 h)
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: sensor.thriftherm_badezimmer_heat_demand
                name: Badezimmer
              - entity: sensor.thriftherm_wohnzimmer_heat_demand
                name: Wohnzimmer

      # Therme: geplanter Vorlauf und Gas je Tag (nur mit Gastherme).
      - type: grid
        cards:
          - type: history-graph
            title: Vorlauf-Soll der Therme (24 h)
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: sensor.thriftherm_boiler_flow_setpoint_planned
                name: Vorlauf-Soll
          # Gas je Tag, aufgeteilt in Heizung und Warmwasser (kWh).
          - type: statistics-graph
            title: Gas je Tag
            chart_type: bar
            period: day
            days_to_show: 14
            stat_types:
              - change
            grid_options:
              columns: full
            entities:
              - entity: sensor.thriftherm_gas_for_heating
                name: Heizung
              - entity: sensor.thriftherm_gas_for_hot_water
                name: Warmwasser
