# Thriftherm: example dashboard (English labels)
#
# Paste: Settings > Dashboards > Add dashboard
#   > New dashboard from scratch > Open the dashboard > pencil top right
#   > ⋮ > Raw configuration editor > replace everything with this file > Save.
#
# Standard Home Assistant cards only, no custom cards from HACS.
# The text cards need Home Assistant 2025.1 or newer.
#
# ADAPT THE ROOMS (important):
#   The "Rooms" view and the "History" view contain two example rooms:
#   "badezimmer" and "wohnzimmer". That is the room key: the room name in
#   lower case as it appears in the entity IDs, without accents or umlauts.
#   Example: room "Küche" gives sensor.thriftherm_kuche_target_temperature,
#   room "Living room" gives sensor.thriftherm_living_room_target_temperature.
#   For each of your rooms copy one room block and replace the room key
#   (search and replace in the editor). Delete rooms you do not have.
#   Find your room keys under Settings > Devices & services > Entities,
#   search for "thriftherm_" and "target_temperature".
#
# THERMOSTAT PER ROOM:
#   "climate.badezimmer" and "climate.wohnzimmer" stand for the thermostat
#   you gave the room in Thriftherm (e.g. Better Thermostat). It supplies
#   the measured room temperature. Replace it with your entity.
#
# Not every room has every entity:
#   - "Window open" exists only with a window contact.
#   - "Thermostat plan" exists only with a thermostat.
#   - "Quick heat-up" exists only with a thermostat or a heat pump in the room.
#   If one is missing, the card shows "Entity not available". Delete that card.
#
# No heat pump: delete the whole "Heat pump" view.
# No gas boiler (e.g. district heating): delete the whole "Boiler" view.

title: Heating
views:
  # ---------------------------------------------------------------------------
  # View 1: Overview. What heats now and why. The reason comes first.
  # ---------------------------------------------------------------------------
  - title: Overview
    path: overview
    icon: mdi:home-thermometer
    type: sections
    max_columns: 3
    sections:
      # Block: why does it heat like this? Plain words from Thriftherm.
      - type: grid
        cards:
          - type: heading
            heading: What happens now
            icon: mdi:comment-question
          # The decision reason as a list. One line per reason.
          - type: markdown
            content: |
              {% set reasons = state_attr('sensor.thriftherm_decision_reason', 'reasons') %}
              {% if reasons %}{% for g in reasons %}
              - {{ g }}
              {%- endfor %}
              {% else %}{{ states('sensor.thriftherm_decision_reason') }}{% endif %}
          # Which heat source Thriftherm uses now.
          - type: tile
            entity: sensor.thriftherm_recommended_heat_source
            name: Recommended
          # Cheaper source by cost per kWh of heat (heat pump only).
          - type: tile
            entity: sensor.thriftherm_cheaper_heat_source
            name: Cheaper
          # Safety state. If it is not OK, the reasons show below.
          - type: tile
            entity: sensor.thriftherm_safety_state
            name: Safety
          # Is anything overridden by hand?
          - type: tile
            entity: binary_sensor.thriftherm_override_active
            name: Overridden
          # Shown only when safety is not OK: the reasons.
          - type: entities
            title: Why degraded
            visibility:
              - condition: state
                entity: sensor.thriftherm_safety_state
                state_not: ok
            entities:
              - type: attribute
                entity: sensor.thriftherm_safety_state
                attribute: issues
                name: Issues
              - type: attribute
                entity: sensor.thriftherm_safety_state
                attribute: frost_rooms
                name: Frost risk in

      # Block: operating mode and the three controls (Off, Plan only, Active).
      - type: grid
        cards:
          - type: heading
            heading: Control
            icon: mdi:tune-variant
          # Operating mode: Automatic, Boiler only, Heat pump only, Summer, Away.
          - type: tile
            entity: select.thriftherm_operating_mode
            name: Operating mode
            grid_options:
              columns: full
            features:
              - type: select-options
          # Return: shown only in the mode "Away".
          - type: entities
            visibility:
              - condition: state
                entity: select.thriftherm_operating_mode
                state: away
            entities:
              - entity: datetime.thriftherm_planned_return
                name: Return
          # Ends every change by hand (thermostat, heat pump, override).
          - type: tile
            entity: button.thriftherm_back_to_automatic
            name: Back to automatic
            icon: mdi:restore
            hide_state: true
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.thriftherm_back_to_automatic
            icon_tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.thriftherm_back_to_automatic
          # The three controls. "Plan only" calculates but sends nothing.
          # Without a heat pump or a boiler that line is missing: delete it.
          - type: entities
            entities:
              - entity: select.thriftherm_heat_pump_control
                name: Heat pump
              - entity: select.thriftherm_boiler_control
                name: Boiler
              - entity: select.thriftherm_room_control
                name: Rooms
              - entity: sensor.thriftherm_automation_state
                name: Automation

      # Block: outdoor temperature, the basis of many decisions.
      - type: grid
        cards:
          - type: heading
            heading: Outside
            icon: mdi:thermometer
          - type: tile
            entity: sensor.thriftherm_outdoor_temperature_selected_source
            name: Outdoor temperature

  # ---------------------------------------------------------------------------
  # View 2: Rooms. One section per room. See the top of the file to adapt it.
  # ---------------------------------------------------------------------------
  - title: Rooms
    path: rooms
    icon: mdi:sofa
    type: sections
    max_columns: 3
    sections:
      # === Room block: badezimmer (example; copy it and replace the room key) ===
      - type: grid
        cards:
          # Heading; the window badge shows only while the window is open.
          - type: heading
            heading: Bathroom
            icon: mdi:shower
            badges:
              - type: entity
                entity: binary_sensor.thriftherm_badezimmer_window_open
                visibility:
                  - condition: state
                    entity: binary_sensor.thriftherm_badezimmer_window_open
                    state: "on"
          # Measured temperature (from the thermostat) and heat demand.
          - type: tile
            entity: climate.badezimmer
            name: Current
            state_content: current_temperature
          - type: tile
            entity: sensor.thriftherm_badezimmer_heat_demand
            name: Heat demand
          # Target now with its reason. A change by hand shows only when there is one.
          - type: markdown
            content: |
              {%- set e = 'sensor.thriftherm_badezimmer_target_temperature' %}
              {%- set f = 'binary_sensor.thriftherm_badezimmer_window_open' %}
              {%- set h = 'binary_sensor.thriftherm_badezimmer_heating_allowed' %}
              {%- set t = 'sensor.thriftherm_badezimmer_thermostat_plan' %}
              {%- if states(e) | is_number %}
              **Target {{ '%.1f' | format(states(e) | float) }} °C**, {{ state_attr_translated(e, 'reason') }}
              {%- else %}
              Target not available right now
              {%- endif %}
              {%- if is_state(f, 'on') %}

              Window open, heating paused
              {%- elif is_state(h, 'off') %}

              Heating paused{% if state_attr(t, 'reason') in ['thermostat_off', 'thermostat_unavailable'] %}: {{ state_attr_translated(t, 'reason') }}{% endif %}
              {%- endif %}
              {%- if state_attr(e, 'override_by') %}

              Changed by hand: {{ state_attr_translated(e, 'override_by') }}
              {%- set u = state_attr(e, 'override_until_ts') %}
              {%- if u %}, until {{ u | timestamp_custom('%H:%M' if (u | timestamp_custom('%Y-%m-%d')) == now().strftime('%Y-%m-%d') else '%d %b %H:%M') }}{% endif %}
              {%- endif %}
          # What Thriftherm gives the thermostat (thermostat only).
          - type: tile
            entity: sensor.thriftherm_badezimmer_thermostat_plan
            name: Thermostat
          # Quick heat-up: the room heats to comfort right away.
          - type: tile
            entity: button.thriftherm_badezimmer_quick_heat_up
            name: Quick heat-up
            icon: mdi:fire
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.thriftherm_badezimmer_quick_heat_up
            icon_tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.thriftherm_badezimmer_quick_heat_up
          # Comfort and setback temperature to set.
          - type: entities
            entities:
              - entity: number.thriftherm_badezimmer_comfort_temperature
                name: Comfort
                icon: mdi:sun-thermometer
              - entity: number.thriftherm_badezimmer_setback_temperature
                name: Setback
                icon: mdi:thermometer-low

      # === Room block: wohnzimmer (second example) ===
      - type: grid
        cards:
          - type: heading
            heading: Living room
            icon: mdi:sofa
            badges:
              - type: entity
                entity: binary_sensor.thriftherm_wohnzimmer_window_open
                visibility:
                  - condition: state
                    entity: binary_sensor.thriftherm_wohnzimmer_window_open
                    state: "on"
          - type: tile
            entity: climate.wohnzimmer
            name: Current
            state_content: current_temperature
          - type: tile
            entity: sensor.thriftherm_wohnzimmer_heat_demand
            name: Heat demand
          - type: markdown
            content: |
              {%- set e = 'sensor.thriftherm_wohnzimmer_target_temperature' %}
              {%- set f = 'binary_sensor.thriftherm_wohnzimmer_window_open' %}
              {%- set h = 'binary_sensor.thriftherm_wohnzimmer_heating_allowed' %}
              {%- set t = 'sensor.thriftherm_wohnzimmer_thermostat_plan' %}
              {%- if states(e) | is_number %}
              **Target {{ '%.1f' | format(states(e) | float) }} °C**, {{ state_attr_translated(e, 'reason') }}
              {%- else %}
              Target not available right now
              {%- endif %}
              {%- if is_state(f, 'on') %}

              Window open, heating paused
              {%- elif is_state(h, 'off') %}

              Heating paused{% if state_attr(t, 'reason') in ['thermostat_off', 'thermostat_unavailable'] %}: {{ state_attr_translated(t, 'reason') }}{% endif %}
              {%- endif %}
              {%- if state_attr(e, 'override_by') %}

              Changed by hand: {{ state_attr_translated(e, 'override_by') }}
              {%- set u = state_attr(e, 'override_until_ts') %}
              {%- if u %}, until {{ u | timestamp_custom('%H:%M' if (u | timestamp_custom('%Y-%m-%d')) == now().strftime('%Y-%m-%d') else '%d %b %H:%M') }}{% endif %}
              {%- endif %}
          - type: tile
            entity: sensor.thriftherm_wohnzimmer_thermostat_plan
            name: Thermostat
          - type: tile
            entity: button.thriftherm_wohnzimmer_quick_heat_up
            name: Quick heat-up
            icon: mdi:fire
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.thriftherm_wohnzimmer_quick_heat_up
            icon_tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.thriftherm_wohnzimmer_quick_heat_up
          - type: entities
            entities:
              - entity: number.thriftherm_wohnzimmer_comfort_temperature
                name: Comfort
                icon: mdi:sun-thermometer
              - entity: number.thriftherm_wohnzimmer_setback_temperature
                name: Setback
                icon: mdi:thermometer-low

  # ---------------------------------------------------------------------------
  # View 3: Boiler. Gas boiler only. Otherwise delete the view.
  # ---------------------------------------------------------------------------
  - title: Boiler
    path: boiler
    icon: mdi:water-boiler
    type: sections
    max_columns: 3
    sections:
      # Block: what the boiler should do and why.
      - type: grid
        cards:
          - type: heading
            heading: Boiler command
            icon: mdi:water-boiler
          - type: tile
            entity: sensor.thriftherm_boiler_command
            name: Command
          # A flow setpoint exists only while the boiler may heat.
          - type: tile
            entity: sensor.thriftherm_boiler_flow_setpoint_planned
            name: Flow setpoint
            visibility:
              - condition: state
                entity: sensor.thriftherm_boiler_flow_setpoint_planned
                state_not:
                  - unknown
                  - unavailable
          - type: entities
            entities:
              - type: attribute
                entity: sensor.thriftherm_boiler_command
                attribute: reason
                name: Reason
                icon: mdi:information-outline
              - type: attribute
                entity: sensor.thriftherm_boiler_command
                attribute: heating_curve_flow
                name: Flow by heating curve
                icon: mdi:chart-bell-curve-cumulative
                suffix: °C
          - type: tile
            entity: binary_sensor.thriftherm_boiler_space_heating_active
            name: Space heating
            icon: mdi:radiator
          - type: tile
            entity: binary_sensor.thriftherm_boiler_hot_water_active
            name: Hot water
            icon: mdi:water-thermometer
          - type: tile
            entity: binary_sensor.thriftherm_boiler_data_available
            name: Data available

      # Block: boiler readings.
      - type: grid
        cards:
          - type: heading
            heading: Readings
            icon: mdi:gauge
          # The spread is disabled by default (diagnostic). Enable it under
          # Entities if you want it, otherwise the tile shows "unavailable".
          - type: tile
            entity: sensor.thriftherm_boiler_flow_return_spread
            name: Flow/return spread
          - type: tile
            entity: sensor.thriftherm_boiler_burner_share
            name: Burner share
          # Gas power needs a gas meter or a Vaillant boiler.
          - type: tile
            entity: sensor.thriftherm_gas_power
            name: Gas power
            icon: mdi:fire
          # Gas for heating and for hot water (meter readings in kWh).
          - type: tile
            entity: sensor.thriftherm_gas_for_heating
            name: Gas heating
            icon: mdi:radiator
          - type: tile
            entity: sensor.thriftherm_gas_for_hot_water
            name: Gas hot water
            icon: mdi:water-thermometer

      # Block: learning. Thriftherm corrects the heating curve by itself.
      - type: grid
        cards:
          - type: heading
            heading: Learning
            icon: mdi:school
          - type: markdown
            content: |
              {% set e = 'sensor.thriftherm_learning_state' %}
              {% set why = {
                'no_heating_run': 'the boiler is not heating right now',
                'rooms_heating_up': 'a room heats up with an extra',
                'setpoint_recently_changed': 'a setpoint was just changed',
                'quick_heat_up': 'a room is in quick heat-up',
                'drying_mode': 'the bathroom is drying',
                'boiler_control_not_active': 'boiler control is not active',
                'hot_water_recent': 'hot water just ran'} %}
              {% set p = state_attr(e, 'paused_because') or [] %}
              **{{ state_translated(e) }}**
              {%- if p %}, because {% for c in p %}{{ why.get(c, 'safety is degraded' if c.startswith('safety_') else c) }}{% if not loop.last %} and {% endif %}{% endfor %}{% endif %}

              Heating curve shifted by {{ '%.1f' | format(state_attr(e, 'heating_curve_offset_k') | float(0)) }} °C
              {%- if state_attr(e, 'flow_set_by') %}

              Flow set by: {{ state_attr(e, 'flow_set_by') }}
              {%- endif %}
              {%- set z = state_attr(e, 'heat_up_extra_k') or {} %}
              {%- if z %}

              Heat-up extra: {% for room, k in z.items() %}{{ room }} {{ '%.1f' | format(k) }} °C{% if not loop.last %}, {% endif %}{% endfor %}
              {%- endif %}

  # ---------------------------------------------------------------------------
  # View 4: Heat pump. Only with a heat pump set up. Otherwise delete it.
  # ---------------------------------------------------------------------------
  - title: Heat pump
    path: heat-pump
    icon: mdi:heat-pump
    type: sections
    max_columns: 3
    sections:
      # Block: command and whether the heat pump may heat.
      - type: grid
        cards:
          - type: heading
            heading: Heat pump command
            icon: mdi:heat-pump
          - type: tile
            entity: sensor.thriftherm_heat_pump_command
            name: Command
          - type: tile
            entity: sensor.thriftherm_heat_pump_run_state
            name: Run state
          - type: entities
            entities:
              - type: attribute
                entity: sensor.thriftherm_heat_pump_command
                attribute: reason
                name: Reason
                icon: mdi:information-outline
          # Shown only when the heat pump is unreachable or not ready to heat.
          - type: tile
            entity: binary_sensor.thriftherm_heat_pump_available_for_heating
            name: Ready to heat
            visibility:
              - condition: state
                entity: binary_sensor.thriftherm_heat_pump_available_for_heating
                state_not: "on"
          - type: tile
            entity: binary_sensor.thriftherm_heat_pump_blocked_for_heating
            name: Block
          - type: tile
            entity: binary_sensor.thriftherm_defrost_or_icing_suspected
            name: Defrost
          # Shown only while the heat pump is blocked: the reason.
          - type: entities
            visibility:
              - condition: state
                entity: binary_sensor.thriftherm_heat_pump_blocked_for_heating
                state: "on"
            entities:
              - type: attribute
                entity: binary_sensor.thriftherm_heat_pump_blocked_for_heating
                attribute: reason
                name: Blocked because
                icon: mdi:lock-alert

      # Block: power and efficiency.
      - type: grid
        cards:
          - type: heading
            heading: Power
            icon: mdi:flash
          # Measured only while it heats.
          - type: tile
            entity: sensor.thriftherm_heat_pump_cop
            name: COP measured
          - type: tile
            entity: sensor.thriftherm_break_even_cop
            name: Pays off from COP
          # The COP Thriftherm calculates with now (also while idle).
          - type: entities
            entities:
              - type: attribute
                entity: sensor.thriftherm_heat_pump_command
                attribute: decision_cop
                name: COP Thriftherm calculates with
                icon: mdi:calculator-variant
          - type: tile
            entity: sensor.thriftherm_heat_pump_thermal_power
            name: Thermal power
          - type: tile
            entity: sensor.thriftherm_heat_pump_electrical_power
            name: Electrical power

      # Block: what does a kWh of heat cost? That decides the cheaper source.
      - type: grid
        cards:
          - type: heading
            heading: Cost per kWh of heat
            icon: mdi:cash
          - type: tile
            entity: sensor.thriftherm_heat_cost_per_kwh_heat_pump
            name: Heat pump
          - type: tile
            entity: sensor.thriftherm_heat_cost_per_kwh_boiler
            name: Boiler
          - type: tile
            entity: sensor.thriftherm_cheaper_heat_source
            name: Cheaper
            grid_options:
              columns: full

  # ---------------------------------------------------------------------------
  # View 5: History.
  # ---------------------------------------------------------------------------
  - title: History
    path: history
    icon: mdi:chart-line
    type: sections
    max_columns: 2
    sections:
      # Per room: measured temperature, target and when it heated (from the thermostat),
      # plus Thriftherm's target (it differs in the mode "Plan only").
      - type: grid
        cards:
          - type: history-graph
            title: Bathroom (24 h)
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: climate.badezimmer
                name: Bathroom
              - entity: sensor.thriftherm_badezimmer_target_temperature
                name: Target by Thriftherm
          - type: history-graph
            title: Living room (24 h)
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: climate.wohnzimmer
                name: Living room
              - entity: sensor.thriftherm_wohnzimmer_target_temperature
                name: Target by Thriftherm
          # Heat demand of the rooms in percent.
          - type: history-graph
            title: Heat demand (24 h)
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: sensor.thriftherm_badezimmer_heat_demand
                name: Bathroom
              - entity: sensor.thriftherm_wohnzimmer_heat_demand
                name: Living room

      # Boiler: planned flow and gas per day (gas boiler only).
      - type: grid
        cards:
          - type: history-graph
            title: Boiler flow setpoint (24 h)
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: sensor.thriftherm_boiler_flow_setpoint_planned
                name: Flow setpoint
          # Gas per day, split into heating and hot water (kWh).
          - type: statistics-graph
            title: Gas per day
            chart_type: bar
            period: day
            days_to_show: 14
            stat_types:
              - change
            grid_options:
              columns: full
            entities:
              - entity: sensor.thriftherm_gas_for_heating
                name: Heating
              - entity: sensor.thriftherm_gas_for_hot_water
                name: Hot water
