name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"  # weekly, so a new Home Assistant release that breaks something shows up
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    # HACS reads the repository anonymously; a private repository answers 404 to it
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # the brand images ship inside the integration instead of the home-assistant/brands repository
          ignore: brands

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: pip install pytest-homeassistant-custom-component==0.13.364
      - name: Run tests
        run: pytest -q
