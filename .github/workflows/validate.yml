name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"  # weekly, so a new Home Assistant release that breaks something shows up
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    # HACS reads the repository anonymously; a private repository answers 404 to it
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20  # a test that hangs stops the run (review 2026-11-18)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install test dependencies
        # always the newest test package: it brings the newest Home Assistant it is made for (2026.10 until one for
        # 2026.11 is out; bridged by hand, 0.13.375 under 2026.11 stops at importing httpx before Home Assistant)
        run: pip install -U pytest-homeassistant-custom-component pytest-xdist pytest-timeout
      - name: Run tests
        run: pytest -q -n auto --timeout=120  # in parallel: 8 s instead of 30; a test hanging fails after 2 minutes
