name: Release zip

# HACS (built into Home Assistant as Marketplace since 2026.11) installs this zip and counts its
# downloads; without it a release has no number to show. Only the public repository publishes.
on:
  release:
    types: [published]

jobs:
  zip:
    name: Attach thriftherm.zip
    if: github.repository == 'alpha-uniform/thriftherm'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Check that the tag matches the manifest version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("custom_components/thriftherm/manifest.json"))["version"])')
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "manifest.json says $version, the release tag is $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Build the zip with the integration at its root
        # HACS unpacks the zip into custom_components/thriftherm, so manifest.json sits at its top;
        # '*__pycache__*' also catches the top-level folder entry, which '*/__pycache__/*' let in
        run: |
          cd custom_components/thriftherm && zip -r ../../thriftherm.zip . -x '*__pycache__*' '*.pyc'
      - name: Upload the zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" thriftherm.zip --clobber --repo "$GITHUB_REPOSITORY"
